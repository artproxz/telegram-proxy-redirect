<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Telegram Proxy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap');

    :root {
      --bg: #070a12;
      --panel: #101724;
      --card: #141d2b;
      --card-soft: #192437;
      --line: rgba(148, 163, 184, .18);
      --text: #f8fafc;
      --muted: #91a0b7;
      --green: #39e58c;
      --green2: #10b981;
      --orange: #ffb020;
      --red: #fb7185;
      --shadow: 0 20px 70px rgba(0, 0, 0, .36);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(16,185,129,.18), transparent 34%),
        radial-gradient(circle at 88% 8%, rgba(56,189,248,.12), transparent 32%),
        var(--bg);
      overflow-x: hidden;
    }

    .page {
      width: min(860px, calc(100% - 28px));
      margin: 0 auto;
      padding: 32px 0 44px;
    }

    .top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.3rem, 7vw, 4.8rem);
      line-height: .9;
      letter-spacing: -.075em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.45;
    }

    .status {
      min-width: 188px;
      padding: 14px 15px;
      border-radius: 20px;
      background: rgba(16, 23, 36, .84);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      text-align: right;
    }

    .status strong {
      display: block;
      font-size: 1.65rem;
      line-height: 1;
      letter-spacing: -.04em;
      color: var(--green);
    }

    .status span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 800;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      min-height: 46px;
    }

    .meta {
      color: var(--muted);
      font-size: .88rem;
      font-weight: 800;
    }

    .buttons { display: flex; gap: 8px; }

    button, .connect {
      border: 0;
      appearance: none;
      border-radius: 14px;
      padding: 11px 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--green), var(--green2));
      font-weight: 900;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: transform .12s ease, filter .12s ease, opacity .12s ease;
    }

    button:hover, .connect:hover { transform: translateY(-1px); filter: brightness(1.05); }
    button:active, .connect:active { transform: translateY(0); }
    button.secondary {
      background: rgba(148, 163, 184, .12);
      border: 1px solid rgba(148, 163, 184, .16);
      color: #e2e8f0;
    }
    button:disabled { opacity: .55; cursor: default; transform: none; }

    .board {
      display: grid;
      gap: 10px;
    }

    .card {
      position: relative;
      min-height: 86px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px 148px;
      align-items: center;
      gap: 12px;
      padding: 15px;
      border-radius: 22px;
      background: linear-gradient(180deg, var(--card), #111827);
      border: 1px solid var(--line);
      box-shadow: 0 14px 40px rgba(0,0,0,.20);
      overflow: hidden;
    }

    .card.hot {
      border-color: rgba(255, 176, 32, .55);
      box-shadow: 0 0 0 1px rgba(255,176,32,.08), 0 18px 54px rgba(255,176,32,.10);
    }

    .card.hot::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(120deg, transparent 0%, rgba(255,176,32,.95) 38%, rgba(57,229,140,.75) 52%, transparent 70%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: edge 2.8s linear infinite;
      pointer-events: none;
    }

    @keyframes edge { to { filter: hue-rotate(30deg); transform: rotate(360deg); } }

    .server {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .flag {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(255,255,255,.05);
      font-size: 1.55rem;
    }

    .name {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 1.03rem;
      font-weight: 900;
    }

    .host {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fire {
      flex: 0 0 auto;
      font-size: 1rem;
      filter: drop-shadow(0 0 8px rgba(255,176,32,.55));
    }

    .port {
      margin-top: 5px;
      color: var(--muted);
      font-weight: 800;
      font-size: .82rem;
    }

    .ping {
      justify-self: end;
      text-align: right;
      min-width: 126px;
      font-variant-numeric: tabular-nums;
    }

    .ping-value {
      display: inline-block;
      min-width: 96px;
      font-size: 1.85rem;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.045em;
      color: #bbf7d0;
    }

    .ping-value.mid { color: #fde68a; }
    .ping-value.bad { color: #fecdd3; }

    .ping-label {
      height: 17px;
      margin-top: 5px;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .actions {
      justify-self: end;
      display: grid;
      grid-template-columns: 1fr 42px;
      gap: 7px;
      width: 148px;
    }

    .copy {
      width: 42px;
      padding-inline: 0;
    }

    .card.used {
      opacity: .45;
      filter: grayscale(.7);
    }
    .card.used .connect { background: rgba(71,85,105,.9); }

    .empty {
      padding: 44px 18px;
      border-radius: 24px;
      background: rgba(16,23,36,.78);
      border: 1px dashed rgba(148,163,184,.24);
      color: var(--muted);
      text-align: center;
      font-weight: 800;
      line-height: 1.5;
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      max-width: calc(100% - 32px);
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(16,23,36,.96);
      border: 1px solid rgba(57,229,140,.22);
      color: #d1fae5;
      font-weight: 900;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: .18s ease;
      z-index: 10;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 720px) {
      .top { align-items: stretch; flex-direction: column; }
      .status { text-align: left; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .buttons { width: 100%; }
      .buttons button { flex: 1; }
      .card { grid-template-columns: 1fr; align-items: stretch; }
      .ping, .actions { justify-self: stretch; text-align: left; width: auto; }
      .actions { grid-template-columns: 1fr 48px; }
      .copy { width: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="top">
      <div>
        <h1>Telegram Proxy</h1>
        <p class="subtitle">Только реально проверенные MTProto. Без лишнего шума.</p>
      </div>
      <div class="status">
        <strong id="count">—</strong>
        <span id="statusText">загружаю</span>
      </div>
    </section>

    <section class="toolbar">
      <div class="meta" id="meta">Проверяю список…</div>
      <div class="buttons">
        <button class="secondary" id="resetBtn" type="button">Сбросить</button>
        <button id="refreshBtn" type="button">Обновить</button>
      </div>
    </section>

    <section class="board" id="board"></section>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    const CONFIG = {
      url: './proxies.json',
      refreshMs: 10_000,
      usedKey: 'telegram_proxy_used_minimal_v2',
      orderKey: 'telegram_proxy_order_minimal_v2'
    };

    const state = {
      data: null,
      proxies: [],
      loading: false,
      renderedIds: []
    };

    const $ = selector => document.querySelector(selector);
    const board = $('#board');
    const countEl = $('#count');
    const statusText = $('#statusText');
    const meta = $('#meta');
    const refreshBtn = $('#refreshBtn');
    const resetBtn = $('#resetBtn');

    const escapeHtml = value => String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

    const readJson = (key, fallback) => {
      try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
      catch { return fallback; }
    };
    const writeJson = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
    };

    const getUsed = () => new Set(readJson(CONFIG.usedKey, []));
    const markUsed = id => {
      const used = getUsed();
      used.add(id);
      writeJson(CONFIG.usedKey, [...used]);
    };

    const formatDate = value => {
      const date = new Date(value);
      if (!value || Number.isNaN(date.getTime())) return '—';
      return date.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    };

    const linkFor = proxy => proxy.raw || `tg://proxy?server=${encodeURIComponent(proxy.server)}&port=${encodeURIComponent(proxy.port)}&secret=${encodeURIComponent(proxy.secret)}`;
    const webLinkFor = proxy => `https://t.me/proxy?server=${encodeURIComponent(proxy.server)}&port=${encodeURIComponent(proxy.port)}&secret=${encodeURIComponent(proxy.secret)}`;

    const pingClass = ping => {
      if (typeof ping !== 'number') return 'bad';
      if (ping <= 350) return '';
      if (ping <= 750) return 'mid';
      return 'bad';
    };

    const toast = text => {
      const el = $('#toast');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.remove('show'), 2200);
    };

    const stableOrder = proxies => {
      const oldOrder = readJson(CONFIG.orderKey, []);
      const existing = new Set(proxies.map(p => p.id));
      const ordered = [];
      for (const id of oldOrder) {
        const item = proxies.find(p => p.id === id);
        if (item) ordered.push(item);
      }
      for (const item of proxies) {
        if (!ordered.find(p => p.id === item.id)) ordered.push(item);
      }
      const finalList = ordered.filter(p => existing.has(p.id));
      writeJson(CONFIG.orderKey, finalList.map(p => p.id));
      return finalList;
    };

    const cardTemplate = proxy => {
      const ping = typeof proxy.pingMs === 'number' ? proxy.pingMs : null;
      const cls = pingClass(ping);
      return `
        <article class="card" data-id="${escapeHtml(proxy.id)}">
          <div class="server">
            <div class="flag">${escapeHtml(proxy.flag || '🌐')}</div>
            <div style="min-width:0">
              <div class="name"><span class="host" title="${escapeHtml(proxy.server)}">${escapeHtml(proxy.server)}</span><span class="fire" hidden>🔥</span></div>
              <div class="port">порт ${escapeHtml(proxy.port)}</div>
            </div>
          </div>
          <div class="ping">
            <span class="ping-value ${cls}">${ping === null ? '—' : `${ping} ms`}</span>
            <div class="ping-label">пинг</div>
          </div>
          <div class="actions">
            <button class="connect" type="button" data-action="connect">Подключить</button>
            <button class="secondary copy" type="button" data-action="copy">⧉</button>
          </div>
        </article>`;
    };

    const updateCard = (proxy, bestPing) => {
      const card = board.querySelector(`[data-id="${CSS.escape(proxy.id)}"]`);
      if (!card) return;
      const used = getUsed().has(proxy.id);
      const hot = proxy.fast || proxy.rank <= 2 || (typeof proxy.pingMs === 'number' && typeof bestPing === 'number' && proxy.pingMs <= bestPing + 80);
      card.classList.toggle('used', used);
      card.classList.toggle('hot', hot && !used);
      card.querySelector('.fire').hidden = !(hot && !used);
      const pingEl = card.querySelector('.ping-value');
      pingEl.textContent = typeof proxy.pingMs === 'number' ? `${proxy.pingMs} ms` : '—';
      pingEl.className = `ping-value ${pingClass(proxy.pingMs)}`.trim();
      card.querySelector('[data-action="connect"]').textContent = used ? 'Ещё раз' : 'Подключить';
    };

    const renderFull = () => {
      if (!state.proxies.length) {
        board.innerHTML = `<div class="empty">Сейчас нет прокси, которые прошли реальную проверку Telegram. Лучше пусто, чем мёртвый сервер.</div>`;
        state.renderedIds = [];
        return;
      }
      board.innerHTML = state.proxies.map(cardTemplate).join('');
      state.renderedIds = state.proxies.map(p => p.id);
    };

    const updateUi = () => {
      const best = state.proxies
        .filter(p => typeof p.pingMs === 'number')
        .map(p => p.pingMs)
        .sort((a, b) => a - b)[0];

      countEl.textContent = String(state.proxies.length || 0);
      statusText.textContent = state.proxies.length ? 'рабочих' : 'нет рабочих';
      meta.textContent = state.data
        ? `Обновлено: ${formatDate(state.data.timestamp)} · следующий прогон: ${formatDate(state.data.next_update)}`
        : 'Проверяю список…';

      const ids = state.proxies.map(p => p.id);
      const sameStructure = ids.length === state.renderedIds.length && ids.every((id, i) => id === state.renderedIds[i]);
      if (!sameStructure) renderFull();
      state.proxies.forEach(proxy => updateCard(proxy, best));
    };

    async function load(manual = false) {
      if (state.loading) return;
      state.loading = true;
      refreshBtn.disabled = true;
      refreshBtn.textContent = 'Обновляю…';

      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 10000);
        const response = await fetch(`${CONFIG.url}?v=${Date.now()}`, { cache: 'no-store', signal: controller.signal });
        clearTimeout(timer);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const used = getUsed();
        const raw = Array.isArray(data.proxies) ? data.proxies : [];
        state.data = data;
        state.proxies = stableOrder(
          raw
            .filter(p => p && p.server && p.port && p.secret && p.online === true && p.checkPassed === true)
            .map(p => ({ ...p, used: used.has(p.id) }))
        );
        updateUi();
        if (manual) toast('Список обновлён');
      } catch (error) {
        console.error(error);
        meta.textContent = 'Не удалось загрузить proxies.json';
        if (!state.proxies.length) board.innerHTML = `<div class="empty">Не удалось загрузить список. Проверь последний запуск GitHub Actions.</div>`;
        toast('Ошибка загрузки');
      } finally {
        state.loading = false;
        refreshBtn.disabled = false;
        refreshBtn.textContent = 'Обновить';
      }
    }

    board.addEventListener('click', async event => {
      const button = event.target.closest('button');
      const card = event.target.closest('.card');
      if (!button || !card) return;
      const proxy = state.proxies.find(p => p.id === card.dataset.id);
      if (!proxy) return;

      if (button.dataset.action === 'connect') {
        markUsed(proxy.id);
        proxy.used = true;
        updateUi();
        window.location.href = linkFor(proxy);
        setTimeout(() => { window.location.href = webLinkFor(proxy); }, 450);
      }

      if (button.dataset.action === 'copy') {
        try {
          await navigator.clipboard.writeText(webLinkFor(proxy));
          toast('Ссылка скопирована');
        } catch (_) {
          toast('Не получилось скопировать');
        }
      }
    });

    refreshBtn.addEventListener('click', () => load(true));
    resetBtn.addEventListener('click', () => {
      localStorage.removeItem(CONFIG.usedKey);
      state.proxies = state.proxies.map(p => ({ ...p, used: false }));
      updateUi();
      toast('Использованные сброшены');
    });

    load(false);
    setInterval(() => load(false), CONFIG.refreshMs);
  </script>
</body>
</html>
