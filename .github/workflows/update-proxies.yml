name: Fetch Telegram Proxies

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEEP_UNVERIFIED_IF_FEW: 'false'
      MAX_PROXIES: '18'
      CHECK_TIMEOUT_MS: '4500'
      CHECK_CONCURRENCY: '20'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch verified proxies
        run: node fetch-proxies.js

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add proxies.json

          if ! git diff --staged --quiet; then
            git commit -m "chore: update verified proxies $(date -u +'%Y-%m-%d %H:%M') [skip ci]"
            git push
          else
            echo "No changes"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
